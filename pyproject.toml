[project]
name = "news-digest"
version = "0.1.0"
description = "News feed pipeline — aggregates RSS feeds and generates AI-powered digests via LangChain + Groq"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Faustze" },
]
dependencies = [
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
]

[project.urls]
Homepage = "https://github.com/Faustze/news-digest"

[project.scripts]
news-digest = "news_pipeline:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = ["ruff>=0.1", "pytest>=8.0"]
