# Run from the repo root: docker compose -f db/docker-compose.yml --env-file .env up -d
# `name` keeps the project (and its volume) the same as when this file lived in the root.
name: news-digest

services:
  postgres:
    image: postgres:16
    container_name: news-digest-db
    environment:
      POSTGRES_USER: newsdigest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: newsdigest
    ports:
      - "5434:5432"
    volumes:
      - news_digest_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsdigest -d newsdigest"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  news_digest_data:
