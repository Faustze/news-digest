name: Daily News Digest

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # `main` is protected (PR + required checks), so generated digests and
  # feedback state live on a separate unprotected branch instead.
  STATE_BRANCH: digest-data
  STATE_DIR: .state

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Restore state
        run: |
          if git fetch --depth=1 origin "$STATE_BRANCH"; then
            git worktree add --detach "$STATE_DIR" FETCH_HEAD
            for f in feedback.json feedback_state.json; do
              if [ -f "$STATE_DIR/$f" ]; then cp "$STATE_DIR/$f" .; fi
            done
          else
            echo "No $STATE_BRANCH branch yet; starting with empty state."
          fi

      - name: Poll Telegram feedback
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: uv run python poll_feedback.py

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run python news_pipeline.py config.yaml

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python send_telegram.py

      # Runs even if delivery failed: the feedback cursor has already been
      # advanced on Telegram's side, so losing it would drop reactions.
      - name: Save state
        if: ${{ !cancelled() }}
        run: |
          if [ ! -d "$STATE_DIR" ]; then
            # First run: start the state branch empty, without main's history.
            git worktree add --detach "$STATE_DIR"
            git -C "$STATE_DIR" checkout --orphan "$STATE_BRANCH"
            git -C "$STATE_DIR" rm -rfq .
          fi
          mkdir -p "$STATE_DIR/output"
          for f in feedback.json feedback_state.json; do
            if [ -f "$f" ]; then cp "$f" "$STATE_DIR/"; fi
          done
          f="output/digest_$(date -u +%Y-%m-%d).txt"
          if [ -f "$f" ]; then cp "$f" "$STATE_DIR/output/"; fi

          cd "$STATE_DIR"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push origin "HEAD:refs/heads/$STATE_BRANCH"
          fi

      - name: Post to job summary
        if: ${{ !cancelled() }}
        run: |
          f="output/digest_$(date -u +%Y-%m-%d).txt"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
