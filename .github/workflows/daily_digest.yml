name: Daily News Digest

on:
  schedule:
    # Off the top of the hour: GitHub delays :00 schedules by hours under load.
    # The profile's frequency decides which of the two runs sends a digest;
    # the other one exits before fetching (no LLM tokens).
    - cron: "17 4 * * *"   # morning: 07:17 MSK
    - cron: "17 15 * * *"  # evening: 18:17 MSK
  workflow_dispatch:
    inputs:
      slot:
        description: Which digest to build
        type: choice
        options: [morning, evening]
        default: morning

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # `main` is protected (PR + required checks), so generated digests and
  # feedback state live on a separate unprotected branch instead.
  STATE_BRANCH: digest-data
  STATE_DIR: .state
  # Must match the evening cron above; everything else is the morning run.
  DIGEST_SLOT: ${{ github.event.schedule == '17 15 * * *' && 'evening' || inputs.slot || 'morning' }}

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Restore state
        run: |
          if git fetch --depth=1 origin "$STATE_BRANCH"; then
            git worktree add --detach "$STATE_DIR" FETCH_HEAD
            for f in feedback.json feedback_state.json sent_news.json; do
              if [ -f "$STATE_DIR/$f" ]; then cp "$STATE_DIR/$f" .; fi
            done
          else
            echo "No $STATE_BRANCH branch yet; starting with empty state."
          fi

      - name: Poll Telegram feedback
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: uv run python -m news.poll_feedback

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run python -m news.pipeline config.yaml

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m news.send_telegram

      # Runs even if delivery failed: the feedback cursor has already been
      # advanced on Telegram's side, so losing it would drop reactions.
      - name: Save state
        if: ${{ !cancelled() }}
        run: |
          if [ ! -d "$STATE_DIR" ]; then
            # First run: start the state branch empty, without main's history.
            git worktree add --detach "$STATE_DIR"
            git -C "$STATE_DIR" checkout --orphan "$STATE_BRANCH"
            git -C "$STATE_DIR" rm -rfq .
          fi
          mkdir -p "$STATE_DIR/output"
          for f in feedback.json feedback_state.json sent_news.json; do
            if [ -f "$f" ]; then cp "$f" "$STATE_DIR/"; fi
          done
          f="output/digest_$(date -u +%Y-%m-%d)_${DIGEST_SLOT}.txt"
          if [ -f "$f" ]; then cp "$f" "$STATE_DIR/output/"; fi

          cd "$STATE_DIR"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "digest: $(date -u +%Y-%m-%d) ${DIGEST_SLOT}"
            git push origin "HEAD:refs/heads/$STATE_BRANCH"
          fi

      - name: Post to job summary
        if: ${{ !cancelled() }}
        run: |
          f="output/digest_$(date -u +%Y-%m-%d)_${DIGEST_SLOT}.txt"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
